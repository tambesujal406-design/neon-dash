<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cyan: #3de8ff;
        --pink: #ff4d8d;
        --violet: #8b6cff;
        --text: #cfd4f5;
        --muted: #8b90b8;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 20px 12px;
        font-family: "Orbitron", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse at 50% 0%, #2d1a6e 0%, rgba(45, 26, 110, 0) 60%),
          radial-gradient(ellipse at 50% 100%, #4a1450 0%, rgba(74, 20, 80, 0) 55%),
          #08051c;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 900;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 14px rgba(139, 108, 255, 0.55));
      }
      .tagline { margin: -10px 0 0; font-size: 11px; font-weight: 500; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
      canvas {
        display: block;
        width: 960px;
        max-width: 100%;
        height: auto;
        border-radius: 16px;
        box-shadow:
          0 0 0 1px rgba(139, 108, 255, 0.4),
          0 0 40px rgba(61, 232, 255, 0.16),
          0 0 120px rgba(255, 77, 141, 0.18);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 26px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .controls li { display: flex; align-items: center; gap: 8px; }
      kbd {
        padding: 4px 8px;
        font: inherit;
        font-weight: 700;
        color: var(--cyan);
        background: rgba(12, 8, 45, 0.7);
        border: 1px solid rgba(61, 232, 255, 0.45);
        border-bottom-width: 3px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>NEON DASH</h1>
    <p class="tagline">Built on a custom TypeScript ECS engine</p>
    <canvas id="game" width="960" height="540" aria-label="Neon Dash game"></canvas>
    <ul class="controls">
      <li><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</li>
      <li><kbd>Space</kbd> <kbd>W</kbd> or <kbd>&uarr;</kbd> Jump</li>
      <li>Land on enemies to stomp them</li>
      <li><kbd>R</kbd> Play again</li>
    </ul>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
